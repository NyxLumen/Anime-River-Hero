<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime River — Living Anime Landscape Painting</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1e24;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #e2e8f0;
      }
      #app-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      /* Subtle artistic cinematic letterbox / overlay controls if needed */
      #ui-overlay {
        position: fixed;
        bottom: 24px;
        left: 28px;
        z-index: 10;
        pointer-events: none;
        user-select: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(245, 240, 230, 0.9);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      .subtitle {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(220, 215, 205, 0.65);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>
    <div id="ui-overlay">
      <div class="title">Anime River</div>
      <div class="subtitle">Phase 2 — Painterly Surface & Atmospheric Treatment</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
